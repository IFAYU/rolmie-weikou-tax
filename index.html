<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蘿荔薇蔻稅算">
<meta name="theme-color" content="#f6f4f0">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%BE</text></svg>">
<title>蘿荔 × 薇蔻 業績與綜所稅試算</title>
<style>
  :root{
    --luoli:#B8925A;
    --weikou:#3E7C8C;
    --bg:#f6f4f0;
    --card:#ffffff;
    --ink:#2b2620;
    --sub:#847c6f;
    --line:#e8e2d8;
    --danger:#c0392b;
    --good:#2f7d4f;
    --warn-bg:#fff7e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #gate{
    position:fixed; inset:0; background:var(--bg); z-index:999;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  }
  #gate input{
    font-size:22px; padding:12px 16px; border-radius:12px; border:1px solid var(--line);
    text-align:center; letter-spacing:6px; width:200px;
  }
  #gate button{
    font-size:16px; padding:10px 24px; border-radius:12px; border:none;
    background:var(--ink); color:#fff;
  }
  #gate .hint{color:var(--sub); font-size:13px;}
  #app{display:none; max-width:720px; margin:0 auto; padding-bottom:80px;}
  header.top{
    position:sticky; top:0; z-index:50; background:var(--bg);
    padding:14px 16px 0; border-bottom:1px solid var(--line);
  }
  header.top h1{font-size:18px; margin:0 0 12px; font-weight:700;}
  .tabs{display:flex; gap:6px;}
  .tab{
    flex:1; text-align:center; padding:10px 4px; border-radius:10px 10px 0 0;
    font-size:13px; font-weight:600; color:var(--sub); cursor:pointer; background:transparent;
    border:1px solid transparent; border-bottom:none;
  }
  .tab.active{background:var(--card); color:var(--ink); border-color:var(--line);}
  section.panel{display:none; padding:16px;}
  section.panel.active{display:block;}

  .subtabs{display:flex; gap:8px; margin-bottom:14px;}
  .subtab{
    flex:1; text-align:center; padding:10px 8px; border-radius:12px; cursor:pointer;
    font-size:13.5px; font-weight:700; border:1px solid var(--line); background:var(--card); color:var(--sub);
  }
  .subtab.active.luoli{border-color:var(--luoli); color:var(--luoli); background:#faf3ea;}
  .subtab.active.weikou{border-color:var(--weikou); color:var(--weikou); background:#eaf3f5;}
  .turn-badge{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:var(--warn-bg); color:#8a6a2f; margin-left:6px; vertical-align:middle;
  }
  .balance-badge{
    display:inline-block; font-size:14px; font-weight:800; color:var(--ink);
    margin-left:6px; vertical-align:middle; white-space:nowrap;
  }
  .balance-badge .bl{font-size:10.5px; font-weight:400; color:var(--sub); margin-right:2px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .accent-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .luoli .accent-dot, .accent-luoli{background:var(--luoli);}
  .weikou .accent-dot, .accent-weikou{background:var(--weikou);}

  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{background:var(--warn-bg); border-radius:12px; padding:10px 12px; min-width:0;}
  .stat .lbl{font-size:11px; color:var(--sub); margin-bottom:4px;}
  .stat .val{font-size:17px; font-weight:700;}
  .stat .val.small{font-size:14px;}
  .stat.wide{grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;}
  .stat.wide .lbl{font-size:11.5px; margin-bottom:0;}
  .stat.wide .val{font-size:19px;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .lbl{font-size:13.5px; color:#5b5346; flex:1 1 auto; min-width:0;}
  .row input[type=number], .row .readonly{flex-shrink:0;}
  .row .lbl .note{display:block; font-size:11px; color:var(--sub); font-weight:400;}
  .row input[type=number]{
    width:130px; text-align:right; font-size:14.5px; padding:7px 9px;
    border:1px solid var(--line); border-radius:8px; background:#fbfaf8;
  }
  .row input[type=number]:focus{outline:2px solid #ccc; background:#fff;}
  .row .readonly{font-weight:700; font-size:14.5px;}
  .row .readonly.danger{color:var(--danger);}
  .row .readonly.good{color:var(--good);}

  details.month{border-bottom:1px solid var(--line);}
  details.month:last-child{border-bottom:none;}
  details.month summary{
    list-style:none; cursor:pointer; padding:10px 2px; display:flex; justify-content:space-between; align-items:center;
  }
  details.month summary::-webkit-details-marker{display:none;}
  details.month summary .m{font-weight:600; font-size:13.5px;}
  details.month summary .sum{font-size:13px; color:var(--sub);}
  details.month .body{padding:0 2px 12px;}
  .minirow{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px;}
  .minirow input{width:110px; text-align:right; padding:5px 7px; border:1px solid var(--line); border-radius:7px; font-size:13px;}
  .minirow .lbl{color:var(--sub);}
  .outstanding{font-size:11.5px; margin-top:6px; padding:6px 8px; border-radius:8px; background:#fbeeee; color:var(--danger);}
  .outstanding.ok{background:#eef7f1; color:var(--good);}

  details.collapsible{margin-bottom:0;}
  details.collapsible > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--sub); font-weight:600; padding:2px 0;
  }
  details.collapsible > summary::-webkit-details-marker{display:none;}
  details.collapsible > summary::before{content:'▸'; font-size:11px;}
  details.collapsible[open] > summary::before{content:'▾'; font-size:11px;}
  details.hint-collapsible{background:var(--warn-bg); border-radius:14px; padding:12px 14px; margin-bottom:14px;}
  details.hint-collapsible > summary{color:#8a6a2f;}
  details.hint-collapsible .hint-body{font-size:12.5px; line-height:1.6; color:#6b5a3a; margin-top:8px;}
  details.settings-collapsible > summary{padding:4px 2px;}

  .mgrid-wrap{overflow-x:auto; margin-top:6px;}
  table.mgrid{width:100%; border-collapse:collapse; min-width:280px;}
  table.mgrid th{font-size:11px; color:var(--sub); font-weight:700; padding:4px 3px; text-align:center;}
  table.mgrid td{padding:3px; text-align:center;}
  table.mgrid td.rn{font-size:11px; color:var(--sub); width:14px;}
  table.mgrid input[type=number]{
    width:100%; min-width:0; box-sizing:border-box; text-align:right; font-size:12px;
    padding:6px 4px; border:1px solid var(--line); border-radius:6px; background:#fbfaf8;
  }
  .month-revenue-row{display:flex; justify-content:space-between; align-items:center; padding:8px 2px 2px; font-size:13px; font-weight:700;}

  .donation-item{display:flex; gap:8px; align-items:center; padding:6px 0;}
  .donation-item input[type=number]{flex:1; text-align:right; padding:6px 8px; border:1px solid var(--line); border-radius:7px;}
  .donation-item input[type=text]{width:90px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:12.5px;}
  .donation-item button{border:none; background:#f1eae0; color:var(--sub); border-radius:7px; width:28px; height:28px; font-size:14px;}
  .addbtn{margin-top:8px; border:1px dashed var(--line); background:transparent; color:var(--sub); border-radius:8px; padding:7px 12px; font-size:12.5px; width:100%;}

  .bracket-table{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;}
  .bracket-table th, .bracket-table td{border:1px solid var(--line); padding:6px 5px; text-align:center;}
  .bracket-table tr.hit{background:var(--warn-bg); font-weight:700;}
  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0;}
  .switch-row label{font-size:12.5px; color:var(--sub);}
  .final-box{
    margin-top:4px; padding:14px; border-radius:14px; text-align:center;
    background:linear-gradient(135deg, #2b2620, #4a4136); color:#fff;
  }
  .final-box .lbl{font-size:12px; opacity:.75; margin-bottom:4px;}
  .final-box .val{font-size:26px; font-weight:800;}
  .final-box .sub{font-size:11px; opacity:.7; margin-top:4px;}

  .footerbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:8px 12px env(safe-area-inset-bottom); gap:8px; max-width:720px; margin:0 auto;
  }
  .footerbar button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fbfaf8; font-size:12.5px; color:var(--sub);
  }
  .hintbox{font-size:11.5px; color:var(--sub); background:#f1eee7; border-radius:10px; padding:9px 11px; margin-bottom:12px; line-height:1.5;}
  input[readonly]{background:#f1eee7; color:var(--sub);}
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm" style="display:flex;flex-direction:column;align-items:center;gap:14px;">
    <div style="font-size:15px;font-weight:700;">蘿荔 × 薇蔻 業績與綜所稅試算</div>
    <input id="gatePw" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password">
    <button type="submit">解鎖</button>
    <div id="gateErr" class="hint">忘記密碼請找 IFAYU</div>
  </form>
</div>

<div id="app">
  <header class="top">
    <h1>蘿荔 × 薇蔻｜業績與綜所稅試算</h1>
    <div class="tabs">
      <div class="tab active" data-tab="overview" onclick="switchTab('overview')">📒 業績總表</div>
      <div class="tab" data-tab="tax" onclick="switchTab('tax')">🧮 綜所稅試算</div>
    </div>
  </header>

  <!-- ================= OVERVIEW (蘿荔/薇蔻 子選單) ================= -->
  <section class="panel active" id="panel-overview">
    <div class="subtabs" id="overview-subtabs"></div>
    <div id="overview-content"></div>
  </section>

  <!-- ================= TAX (蘿荔/薇蔻 子選單) ================= -->
  <section class="panel" id="panel-tax">
    <div class="subtabs" id="tax-subtabs"></div>
    <div id="tax-content"></div>
  </section>

  <div class="footerbar">
    <button onclick="exportBackup()">⬇️ 匯出備份</button>
    <button onclick="document.getElementById('importFile').click()">⬆️ 匯入備份</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)">
  </div>
</div>

<script>
const STORAGE_KEY = 'rolmie.weikou.tax.v2';
const BRACKETS = [
  {min:0,       max:590000,   rate:0.05, diff:0,      label:'0 ~ 590,000'},
  {min:590001,  max:1330000,  rate:0.12, diff:41300,  label:'590,001 ~ 1,330,000'},
  {min:1330001, max:2660000,  rate:0.20, diff:147700, label:'1,330,001 ~ 2,660,000'},
  {min:2660001, max:4980000,  rate:0.30, diff:413700, label:'2,660,001 ~ 4,980,000'},
  {min:4980001, max:Infinity, rate:0.40, diff:911700, label:'4,980,001 以上'},
];
const EXEMPTION_PER_PERSON = 97000;

function emptyMonth(year, month){
  return { year, month, purchases:[0,0,0,0,0], rebates:[0,0,0,0,0], issued:[0,0,0,0,0] };
}
function seedMonths(startYear){
  // 16個月捲動視窗：起始年 1~12月 + 次年 1~4月，讓年度交界時留底可以往下延續
  const arr = [];
  for(let m=1; m<=12; m++) arr.push(emptyMonth(startYear, m));
  for(let m=1; m<=4; m++) arr.push(emptyMonth(startYear+1, m));
  return arr;
}

function defaultData(){
  return {
    companies: {
      luoli: {
        name: '蘿荔企業社',
        profitRate: 0.10,
        taxYear: 2025, // 計稅年度（114年度）；目前總計營業額＝該年度12個月明細加總
        carryInBalance: 119334, // 併入16個月視窗之前的累積留底結餘（相當於原表「去年留底金額」，會隨月份捲動自動累加，不用每年手動重填）
        rewardBonus: 1140000,    // 扣憑獎勵金
        donations: [ {amount:98000, note:'114年捐贈收據'} ],
        months: seedMonths(2025),
        tax: { exemptionCount:5, specialDeduction:150000, withheldTax:0, dividendCredit:0, manualBracket:false, manualRate:0.20, manualDiff:147700 }
      },
      weikou: {
        name: '薇蔻企業社',
        profitRate: 0.06,
        taxYear: 2025,
        carryInBalance: 0,
        rewardBonus: 0,
        donations: [ {amount:50000, note:'114年捐贈收據'} ],
        months: seedMonths(2025),
        tax: { exemptionCount:2, specialDeduction:0, withheldTax:0, dividendCredit:0, manualBracket:false, manualRate:0.05, manualDiff:0 }
      }
    }
  };
}

let DATA = null;

function migrateMonth(mo){
  // 舊格式 purchase/issued 是單一數字，新格式改成各5格陣列（可記多張發票）
  if(!Array.isArray(mo.purchases)){
    mo.purchases = [+mo.purchase||0, 0,0,0,0];
    delete mo.purchase;
  }
  if(!Array.isArray(mo.issued)){
    mo.issued = [+mo.issued||0, 0,0,0,0];
  }
  if(!Array.isArray(mo.rebates)) mo.rebates = [0,0,0,0,0];
  return mo;
}
function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  let changed = !raw;
  try{
    DATA = raw ? JSON.parse(raw) : defaultData();
  }catch(e){ DATA = defaultData(); changed = true; }
  Object.values(DATA.companies).forEach(c => {
    c.months.forEach(migrateMonth);
    if(autoAdvanceYear(c)) changed = true;
  });
  if(changed) save();
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
}

function fmt(n){
  n = Math.round(n||0);
  return 'NT$ ' + n.toLocaleString('zh-Hant-TW');
}
function fmtPlain(n){
  n = Math.round(n||0);
  return n.toLocaleString('zh-Hant-TW');
}

// ---- 計算核心 ----
function sumArr(arr){ return (arr||[]).reduce((a,b)=>a+(+b||0),0); }
function monthRevenue(mo){
  return sumArr(mo.rebates) + sumArr(mo.issued);
}
function monthPurchaseTotal(mo){
  return sumArr(mo.purchases);
}
// 目前總計營業額＝計稅年度那12個月的明細加總（純由月份資料算出，不是固定數字）
function companyRevenue(c){
  return c.months.filter(mo=>mo.year===c.taxYear).reduce((a,mo)=>a+monthRevenue(mo),0);
}
// 留底結餘採跨月累加（承接 carryInBalance），16個月視窗內每月都有累積後的結餘，
// 這樣就算年度交界（12月→1月）留底也會自動延續，不用每年手動重填「去年留底金額」
function runningBalances(c){
  let bal = +c.carryInBalance || 0;
  return c.months.map(mo=>{
    bal += monthPurchaseTotal(mo) - monthRevenue(mo);
    return bal;
  });
}
// 目前留底結餘＝16個月視窗內最新一筆累積結餘（會隨月份填寫變動，不是固定值）
function companyCurrentBalance(c){
  const arr = runningBalances(c);
  return arr.length ? arr[arr.length-1] : (+c.carryInBalance||0);
}
function companyEstimatedProfit(c){
  return companyRevenue(c) * c.profitRate;
}
function companyTotalIncome(c){ // 綜合所得總額 = 扣憑獎勵金 + 執行業務所得(推計)
  return (+c.rewardBonus||0) + companyEstimatedProfit(c);
}
function companyDonationTotal(c){
  return (c.donations||[]).reduce((a,d)=>a+(+d.amount||0),0);
}
function lookupBracket(net){
  return BRACKETS.find(b => net >= b.min && net <= b.max) || BRACKETS[0];
}
function taxCalc(c){
  const total = companyTotalIncome(c);
  const exemption = EXEMPTION_PER_PERSON * (+c.tax.exemptionCount||0);
  const deduction = companyDonationTotal(c);
  const special = +c.tax.specialDeduction||0;
  let net = total - exemption - deduction - special;
  if(net < 0) net = 0;
  const auto = lookupBracket(net);
  const rate = c.tax.manualBracket ? (+c.tax.manualRate||0) : auto.rate;
  const diff = c.tax.manualBracket ? (+c.tax.manualDiff||0) : auto.diff;
  let due = Math.floor(net*rate - diff);
  if(due < 0) due = 0;
  const withheld = +c.tax.withheldTax||0;
  const credit = +c.tax.dividendCredit||0;
  const final = due - withheld - credit;
  return {total, exemption, deduction, special, net, auto, rate, diff, due, withheld, credit, final};
}

// ---- 本月輪到誰填進貨發票：1.2/5.6/9.10月→薇蔻，3.4/7.8/11.12月→蘿荔 ----
function currentTurnCompany(){
  const m = new Date().getMonth() + 1;
  return ((m - 1) % 4) < 2 ? 'weikou' : 'luoli';
}
function companyOrder(){
  const turn = currentTurnCompany();
  return turn === 'luoli' ? ['luoli','weikou'] : ['weikou','luoli'];
}

// ---- Render: Overview（跟綜所稅試算一樣用蘿荔/薇蔻子選單，不用兩家都攤開） ----
let currentOverviewCompany = null;

function renderOverviewSubtabs(){
  const el = document.getElementById('overview-subtabs');
  const order = companyOrder();
  el.innerHTML = order.map(key=>{
    const c = DATA.companies[key];
    const active = key===currentOverviewCompany;
    const isTurn = key===order[0];
    return `<div class="subtab ${active?'active '+key:''}" onclick="selectOverviewCompany('${key}')">${c.name}${isTurn?' 📌':''}</div>`;
  }).join('');
}
function selectOverviewCompany(key){
  currentOverviewCompany = key;
  renderOverviewSubtabs();
  renderOverviewContent(key);
}
function renderOverviewContent(key){
  const el = document.getElementById('overview-content');
  const order = companyOrder();
  const turn = order[0];
  const turnName = DATA.companies[turn].name;
  const c = DATA.companies[key];

  let html = `
  <details class="collapsible hint-collapsible">
    <summary>💡 說明 · 本月該填 <b>${turnName}</b>（點擊展開）</summary>
    <div class="hint-body">
      目前總計營業額是<b>計稅年度那12個月明細加總算出來的</b>，不是固定數字——月份資料改了，營業額、綜所稅會一起變動。
      月份明細顯示計稅年度整年12個月＋隔年1~4月，跨年度時留底結餘會自動接續；
      一旦真實日期超過隔年4月底，去年整年明細會自動併入「留底結餘」後從畫面消失，總額不會漏算，只是不再顯示逐月明細。<br>
      📌 本月（1.2/5.6/9.10月薇蔻，3.4/7.8/11.12月蘿荔）該填進貨發票的是<b>${turnName}</b>，已自動排到最前面。
    </div>
  </details>`;

  html += companyOverviewCard(key, c, taxCalc(c), key===turn);

  el.innerHTML = html;
}

function companyOverviewCard(key, c, t, isTurn){
  const accent = key==='luoli' ? 'luoli' : 'weikou';
  const balances = runningBalances(c);
  let monthsHtml = '';
  let lastYear = null;
  c.months.forEach((mo,i)=>{
    if(mo.year !== lastYear){
      monthsHtml += `<div style="font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 2px;">${mo.year} 年${mo.year===c.taxYear?'（計稅年度）':''}</div>`;
      lastYear = mo.year;
    }
    const rev = monthRevenue(mo);
    const bal = balances[i];
    let gridRows = '';
    for(let ri=0; ri<5; ri++){
      gridRows += `
        <tr>
          <td class="rn">${ri+1}</td>
          <td><input type="number" value="${mo.purchases[ri]}" onchange="updateMonthField('${key}',${i},'purchases',${ri},this.value)"></td>
          <td><input type="number" value="${mo.rebates[ri]}" onchange="updateMonthField('${key}',${i},'rebates',${ri},this.value)"></td>
          <td><input type="number" value="${mo.issued[ri]}" onchange="updateMonthField('${key}',${i},'issued',${ri},this.value)"></td>
        </tr>`;
    }
    monthsHtml += `
    <details class="month">
      <summary>
        <span class="m">${mo.month} 月</span>
      </summary>
      <div class="body">
        <div class="mgrid-wrap">
          <table class="mgrid">
            <tr><th></th><th>進貨發票</th><th>返傭</th><th>開立發票</th></tr>
            ${gridRows}
          </table>
        </div>
        <div class="month-revenue-row"><span>本月營業額</span><span>${fmtPlain(rev)}</span></div>
        <div class="outstanding ${bal<=0?'ok':''}">${bal>0 ? `累積留底結餘約 ${fmtPlain(bal)}` : (bal<0 ? `累積超開 ${fmtPlain(-bal)}` : '留底已結清')}</div>
      </div>
    </details>`;
  });

  let donHtml = '';
  c.donations.forEach((d,i)=>{
    donHtml += `<div class="donation-item">
      <input type="text" placeholder="備註" value="${d.note||''}" onchange="updateDonation('${key}',${i},'note',this.value)">
      <input type="number" value="${d.amount}" onchange="updateDonation('${key}',${i},'amount',this.value)">
      <button onclick="removeDonation('${key}',${i})">✕</button>
    </div>`;
  });

  return `
  <div class="card ${accent}">
    <h2><span class="accent-dot"></span>${c.name}${isTurn ? '<span class="turn-badge">本月填這家</span>' : ''}<span class="balance-badge"><span class="bl">留底結餘</span>${fmtPlain(companyCurrentBalance(c))}</span></h2>
    <div class="summary-grid">
      <div class="stat"><div class="lbl">目前總計營業額</div><div class="val">${fmtPlain(companyRevenue(c))}</div></div>
      <div class="stat"><div class="lbl">推計執行業務所得（×${(c.profitRate*100).toFixed(0)}%）</div><div class="val small">${fmtPlain(companyEstimatedProfit(c))}</div></div>
      <div class="stat"><div class="lbl">預計個人所得總額</div><div class="val">${fmtPlain(t.total)}</div></div>
      <div class="stat"><div class="lbl">預計應納稅額</div><div class="val small" style="color:var(--danger)">${fmtPlain(t.final)}</div></div>
    </div>

    <details class="collapsible settings-collapsible" style="margin-top:10px;">
      <summary>⚙️ 設定（計稅年度／留底起點／扣憑獎勵金／淨利率，點擊展開編輯）</summary>
      <div class="row" style="margin-top:8px;">
        <span class="lbl">計稅年度<span class="note">目前總計營業額只加總這一年的12個月；改這裡會重建下方月份視窗</span></span>
        <input type="number" value="${c.taxYear}" onchange="setTaxYear('${key}',+this.value)">
      </div>
      <div class="row">
        <span class="lbl">留底結餘（視窗起點）<span class="note">併入最舊保留月份之前的累積結餘，相當於原表「去年留底金額」</span></span>
        <input type="number" value="${c.carryInBalance}" onchange="DATA.companies['${key}'].carryInBalance=+this.value;save();renderAll();">
      </div>
      <div class="row">
        <span class="lbl">扣憑獎勵金</span>
        <input type="number" value="${c.rewardBonus}" onchange="DATA.companies['${key}'].rewardBonus=+this.value;save();renderAll();">
      </div>
      <div class="row">
        <span class="lbl">推計淨利率</span>
        <input type="number" step="0.01" value="${c.profitRate}" onchange="DATA.companies['${key}'].profitRate=+this.value;save();renderAll();">
      </div>
    </details>

    <h2 style="margin-top:14px;">🧾 月份明細（點開編輯，顯示計稅年度整年＋隔年1~4月；過了隔年4月，去年整年會自動併入留底結餘並消失）</h2>
    ${monthsHtml}

    <h2 style="margin-top:14px;">🎁 捐贈收據</h2>
    ${donHtml}
    <button class="addbtn" onclick="addDonation('${key}')">＋ 新增一筆捐贈</button>
  </div>`;
}

function updateMonthField(key, i, field, idx, val){
  DATA.companies[key].months[i][field][idx] = +val || 0;
  save(); renderAll();
}
// 把月份明細重建成「newYear全年12個月 + newYear+1的1~4月」共16個月的視窗，
// 原本視窗內還在新範圍的月份資料原封不動保留，範圍外的月份把差額併入留底結餘再捨棄
function rebuildWindowForYear(c, newYear){
  const keepMap = {};
  c.months.forEach(mo=>{
    const inRange = (mo.year===newYear) || (mo.year===newYear+1 && mo.month<=4);
    if(inRange){ keepMap[mo.year+'-'+mo.month] = mo; }
    else { c.carryInBalance = (+c.carryInBalance||0) + monthPurchaseTotal(mo) - monthRevenue(mo); }
  });
  const months = [];
  for(let m=1;m<=12;m++) months.push(keepMap[newYear+'-'+m] || emptyMonth(newYear,m));
  for(let m=1;m<=4;m++) months.push(keepMap[(newYear+1)+'-'+m] || emptyMonth(newYear+1,m));
  c.taxYear = newYear;
  c.months = months;
}
function setTaxYear(key, newYear){
  rebuildWindowForYear(DATA.companies[key], newYear);
  save(); renderAll();
}
// 依裝置目前實際日期自動判斷：一旦真實時間超過「計稅年度+1」的4月底，
// 去年整年份的明細就自動併入留底結餘、從畫面上消失（總額不會少算，只是不再顯示逐月明細）
function autoAdvanceYear(c){
  const now = new Date();
  const ry = now.getFullYear(), rm = now.getMonth()+1;
  let changed = false;
  while(ry > c.taxYear+1 || (ry === c.taxYear+1 && rm > 4)){
    rebuildWindowForYear(c, c.taxYear+1);
    changed = true;
  }
  return changed;
}
function addDonation(key){
  DATA.companies[key].donations.push({amount:0, note:''});
  save(); renderAll();
}
function removeDonation(key, i){
  DATA.companies[key].donations.splice(i,1);
  save(); renderAll();
}
function updateDonation(key, i, field, val){
  DATA.companies[key].donations[i][field] = field==='amount' ? (+val||0) : val;
  save(); renderAll();
}

// ---- Render: Tax sub-tabs + panel (shared for luoli/weikou) ----
let currentTaxCompany = null;

function renderTaxSubtabs(){
  const el = document.getElementById('tax-subtabs');
  const order = companyOrder();
  el.innerHTML = order.map(key=>{
    const c = DATA.companies[key];
    const active = key===currentTaxCompany;
    return `<div class="subtab ${active?'active '+key:''}" onclick="selectTaxCompany('${key}')">${c.name}</div>`;
  }).join('');
}
function selectTaxCompany(key){
  currentTaxCompany = key;
  renderTaxSubtabs();
  renderTaxPanel(key);
}

function renderTaxPanel(key){

  const t = taxCalc(c);

    <tr class="${!c.tax.manualBracket && b===t.auto ? 'hit' : ''}">
      <td>${b.label}</td><td>${(b.rate*100).toFixed(0)}%</td><td>${fmtPlain(b.diff)}</td>
    </tr>`).join('');

  el.innerHTML = `
  <div class="final-box">
    <div class="lbl">${t.final>=0 ? '預估應納稅額' : '預估退稅金額'}</div>
    <div class="val">${fmt(Math.abs(t.final))}</div>
    <div class="sub">綜合所得淨額 ${fmtPlain(t.net)} × ${(t.rate*100).toFixed(0)}% － 累進差額 ${fmtPlain(t.diff)}</div>
  </div>

  <details class="collapsible hint-collapsible" style="margin-top:12px;">
    <summary>💡 說明（點擊展開）</summary>
    <div class="hint-body">
      ${c.name} 綜所稅試算，公式與原 Excel 一致：<br>
      綜合所得總額 = 扣憑獎勵金 ＋ 營業額 × 推計淨利率<br>
      綜合所得淨額 = 總額 － 免稅額 － 扣除額（捐贈）－ 特別扣除額<br>
      應納稅額 = 綜合所得淨額 × 稅率 － 累進差額（取自114年度速算公式）
    </div>
  </details>

  <div class="card ${accent}">
    <h2><span class="accent-dot"></span>綜合所得總額</h2>
    <div class="row"><span class="lbl">扣憑獎勵金</span><span class="readonly">${fmtPlain(c.rewardBonus)}</span></div>
    <div class="row"><span class="lbl">推計執行業務所得</span><span class="readonly">${fmtPlain(companyEstimatedProfit(c))}</span></div>
    <div class="row"><span class="lbl">綜合所得總額</span><span class="readonly">${fmtPlain(t.total)}</span></div>
  </div>

  <div class="card ${accent}">
    <h2>免稅額 / 扣除額 / 特別扣除額</h2>
    <div class="row"><span class="lbl">免稅額人數<span class="note">每人 97,000</span></span>
      <input type="number" value="${c.tax.exemptionCount}" onchange="DATA.companies['${key}'].tax.exemptionCount=+this.value;save();renderAll();"></div>
    <div class="row"><span class="lbl">免稅額小計</span><span class="readonly">${fmtPlain(t.exemption)}</span></div>
    <div class="row"><span class="lbl">扣除額（捐贈收據總額）<span class="note">來自「業績總表」捐贈明細，可在總表分頁調整</span></span>
      <span class="readonly">${fmtPlain(t.deduction)}</span></div>
    <div class="row"><span class="lbl">特別扣除額<span class="note">如：6歲以下幼兒學前特別扣除額 150,000／人</span></span>
      <input type="number" value="${c.tax.specialDeduction}" onchange="DATA.companies['${key}'].tax.specialDeduction=+this.value;save();renderAll();"></div>
    <div class="row"><span class="lbl" style="font-weight:700;">綜合所得淨額</span><span class="readonly" style="font-size:16px;">${fmtPlain(t.net)}</span></div>
  </div>

  <div class="card ${accent}">
    <h2>稅率 / 累進差額</h2>
    <div class="switch-row">
      <label>手動指定級距（關閉＝依淨額自動對照下表）</label>
      <input type="checkbox" ${c.tax.manualBracket?'checked':''} onchange="DATA.companies['${key}'].tax.manualBracket=this.checked;save();renderAll();">
    </div>
    ${c.tax.manualBracket ? `
      <div class="row"><span class="lbl">稅率</span><input type="number" step="0.01" value="${c.tax.manualRate}" onchange="DATA.companies['${key}'].tax.manualRate=+this.value;save();renderAll();"></div>
      <div class="row"><span class="lbl">累進差額</span><input type="number" value="${c.tax.manualDiff}" onchange="DATA.companies['${key}'].tax.manualDiff=+this.value;save();renderAll();"></div>
    ` : `
      <div class="row"><span class="lbl">目前適用稅率</span><span class="readonly">${(t.rate*100).toFixed(0)}%</span></div>
      <div class="row"><span class="lbl">累進差額</span><span class="readonly">${fmtPlain(t.diff)}</span></div>
    `}
    <table class="bracket-table">
      <tr><th>綜合所得淨額區間</th><th>稅率</th><th>累進差額</th></tr>
      ${bracketRows}
    </table>
  </div>

  <div class="card ${accent}">
    <h2>扣抵</h2>
    <div class="row"><span class="lbl">應納稅額（未扣抵前）</span><span class="readonly">${fmtPlain(t.due)}</span></div>
    <div class="row"><span class="lbl">扣繳稅額</span>
      <input type="number" value="${c.tax.withheldTax}" onchange="DATA.companies['${key}'].tax.withheldTax=+this.value;save();renderAll();"></div>
    <div class="row"><span class="lbl">股利或盈餘可抵減稅額</span>
      <input type="number" value="${c.tax.dividendCredit}" onchange="DATA.companies['${key}'].tax.dividendCredit=+this.value;save();renderAll();"></div>
  </div>
  `;
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
}

function renderAll(){
  if(!currentTaxCompany) currentTaxCompany = companyOrder()[0];
  if(!currentOverviewCompany) currentOverviewCompany = companyOrder()[0];
  renderOverviewSubtabs();
  renderOverviewContent(currentOverviewCompany);
  renderTaxSubtabs();
  renderTaxPanel(currentTaxCompany);
}

// ---- Backup ----
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `蘿荔薇蔻備份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      DATA = parsed; save(); renderAll();
      alert('匯入成功');
    }catch(err){ alert('檔案格式錯誤'); }
  };
  reader.readAsText(file);
}

// ---- Gate ----
const GATE_PW = '0000';
const GATE_KEY = 'rolmie.weikou.tax.unlocked';

function openApp(){
  const g = document.getElementById('gate');
  if(g) g.remove();
  document.getElementById('app').style.display='block';
  load(); renderAll();
}

document.getElementById('gateForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  const pw = document.getElementById('gatePw');
  if(pw.value === GATE_PW){
    localStorage.setItem(GATE_KEY,'1');
    openApp();
  } else {
    document.getElementById('gateErr').textContent = '密碼不對，再試一次';
    pw.value = '';
  }
});

if(localStorage.getItem(GATE_KEY) === '1'){
  openApp();
}
